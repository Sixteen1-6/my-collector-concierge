<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For JB · My Collector Concierge</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Your 18 topics, answered: the plan to turn the My CC website and portal into the system the business runs on.">
<meta name="theme-color" content="#082A1F">
<link rel="icon" href="../img/favicon.svg" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:title" content="For JB: your 18 topics, answered">
<meta property="og:description" content="The plan to turn the My CC website and portal into the system the business runs on.">
<meta property="og:image" content="https://sixteen1-6.github.io/my-collector-concierge/img/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
/* A deck in the site's own language: every topic is a grading-slab label on the velvet case,
   answers read like the stat lines on a card back, and the 18 topics sit in two nine-pocket binder pages. */
:root{
  --stock:#F1F3F0; --label:#FFFFFF; --velvet:#0E3D2E; --velvet-d:#082A1F; --text:#102A21;
  --ink-2:#33473F; --soft:#56685F; --foil:#E1B53C; --foil-h:#EDC757; --brass:#7E6210;
  --rule:#D5DCD7; --rule-d:rgba(241,243,240,.18); --mist:#A6BAB0; --paper-a:rgba(241,243,240,.84);
  --sans:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;
  --cond:62%; --semi:80%; --wide:118%;
  --bar:64px;
  --gl:max(clamp(16px,4vw,56px),env(safe-area-inset-left,0px));
  --gr:max(clamp(16px,4vw,56px),env(safe-area-inset-right,0px));
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--velvet-d);color:var(--label);font-family:var(--sans);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-text-size-adjust:100%}
img{max-width:100%;display:block}
a{color:inherit}
p,h1,h2,h3,dl,dd,ul,ol{margin:0;padding:0}
ul,ol{list-style:none}
h1,h2,h3{font-stretch:var(--cond);font-weight:800;line-height:.95;text-wrap:balance}
button{font-family:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums lining-nums}
:focus-visible{outline:3px solid var(--foil);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* stage */
.deck{position:fixed;inset:0 0 calc(var(--bar) + env(safe-area-inset-bottom,0px)) 0;
  background:radial-gradient(120% 90% at 70% 0%,#12503C 0%,var(--velvet) 38%,var(--velvet-d) 100%)}
.slide{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;display:flex;flex-direction:column;
  padding:clamp(16px,3.4vh,40px) var(--gr) clamp(16px,3.4vh,40px) var(--gl);padding-top:max(clamp(16px,3.4vh,40px),env(safe-area-inset-top,0px));
  visibility:hidden;opacity:0;transform:translateX(34px);
  transition:opacity .3s ease,transform .5s cubic-bezier(.2,.7,.2,1),visibility 0s linear .5s}
.slide.on{visibility:visible;opacity:1;transform:none;transition-delay:0s}
.slide.gone{transform:translateX(-34px)}
.back .slide{transform:translateX(-34px)}
.back .slide.on{transform:none}
.back .slide.gone{transform:translateX(34px)}
.slide>*{margin:auto;width:min(1140px,100%)}
@media (prefers-reduced-motion:reduce){.slide{transition:none;transform:none!important}}

/* the slab label */
.slab{background:var(--label);color:var(--text);border-radius:4px;box-shadow:0 30px 60px rgba(0,0,0,.35),0 0 0 6px rgba(241,243,240,.14)}
.band{display:flex;justify-content:space-between;align-items:center;gap:16px;background:var(--velvet);color:var(--label);padding:10px 22px;
  font:700 12.5px/1.25 var(--sans);font-stretch:var(--wide);letter-spacing:.06em;text-transform:uppercase;border-radius:4px 4px 0 0}
.band span:last-child{text-align:right;white-space:nowrap}
.band.foil{background:var(--foil);color:var(--velvet-d)}
.body{padding:clamp(20px,2.6vw,34px) clamp(18px,2.8vw,36px) clamp(20px,2.6vw,32px)}
.eyebrow{font:600 15px var(--sans);color:var(--brass)}
.dark .eyebrow{color:var(--foil)}
.textlink{font-weight:600;text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:2px;text-decoration-color:var(--foil)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font:700 16px/1 var(--sans);font-stretch:var(--semi);padding:15px 20px;border-radius:3px;border:2px solid transparent;cursor:pointer;text-decoration:none}
.btn-foil{background:var(--foil);color:var(--velvet-d)}
.btn-foil:hover{background:var(--foil-h)}
.btn-ghost{border-color:rgba(241,243,240,.5);color:var(--label);background:none}
.btn-ghost:hover{border-color:var(--label)}
.btn-line{border-color:var(--velvet);color:var(--velvet);background:none}
.btn-line:hover{background:var(--velvet);color:var(--label)}

/* topic slide: label on the left, card back on the right */
.topic .body{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(20px,3.2vw,48px);align-items:start}
.q-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:start}
.q-head h2{font-size:clamp(2rem,3.5vw,3.4rem);color:var(--velvet);margin-top:8px}
.q-sub{font-size:15.5px;color:var(--soft);margin-top:10px}
.grade{display:grid;justify-items:center;gap:6px}
.grade b{width:76px;height:76px;display:grid;place-items:center;border:3px solid var(--velvet);border-radius:3px;font:900 46px/1 var(--sans);font-stretch:var(--cond);color:var(--velvet)}
.grade span{font:700 11.5px var(--sans);font-stretch:var(--wide);letter-spacing:.06em;color:var(--velvet);text-transform:uppercase}
.short{font-size:clamp(17.5px,1.5vw,20px);line-height:1.45;color:var(--text);margin-top:18px;max-width:44ch}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:22px;border-top:3px solid var(--velvet)}
.stats div{padding:12px 14px 0 0}
.stats div+div{padding-left:14px;border-left:1px solid var(--rule)}
.stats strong{display:block;font:800 clamp(21px,2.1vw,30px)/1.05 var(--sans);font-stretch:var(--wide);color:var(--velvet)}
.stats span{display:block;font-size:13.5px;line-height:1.3;color:var(--soft);margin-top:5px}
.rows{border-top:3px solid var(--velvet)}
.rows>div{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr);gap:4px 20px;padding:13px 0;border-bottom:1px solid var(--rule)}
.rows dt{font:700 15.5px/1.3 var(--sans);font-stretch:var(--semi);color:var(--velvet)}
.rows dd{font-size:16px;line-height:1.45;color:var(--ink-2)}
.rows dd b{color:var(--text);font-weight:700}
.more{display:inline-block;margin-top:16px;font-size:15px;color:var(--ink-2)}
.need{margin-top:14px;font-size:15px;color:var(--ink-2);padding:10px 14px;background:var(--stock);border-left:4px solid var(--foil)}
.need b{color:var(--text)}
table.cb{width:100%;border-collapse:collapse;border-top:3px solid var(--velvet);font-size:15.5px}
table.cb th{font:700 12.5px var(--sans);font-stretch:var(--wide);letter-spacing:.05em;text-transform:uppercase;text-align:left;color:var(--soft);padding:9px 12px 9px 0;border-bottom:1px solid var(--rule)}
table.cb td{padding:10px 12px 10px 0;border-bottom:1px solid var(--rule);color:var(--ink-2);vertical-align:top}
table.cb td:first-child{font-weight:700;font-stretch:var(--semi);color:var(--velvet);white-space:nowrap}
.scroll-x{overflow-x:auto}

.topic.wide .body{grid-template-columns:minmax(0,1fr);gap:22px}
.topic.wide .body>div:first-child{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(20px,3.2vw,48px);align-items:end}
.topic.wide .short{margin-top:0;max-width:52ch}
.topic.wide .phase h3{font-size:26px}
.topic.wide .phase p{font-size:15.5px}

/* dark, label-free slides */
.dark h2{font-size:clamp(2.5rem,5.6vw,5rem);color:var(--label)}
.dark .lede{font-size:clamp(17.5px,1.6vw,21px);color:var(--paper-a);max-width:52ch;margin-top:18px}
.split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(24px,4vw,64px);align-items:center}
.four{display:grid;grid-template-columns:1fr 1fr;gap:0 28px;margin-top:26px;border-top:1px solid var(--rule-d)}
.four li{padding:14px 0;border-bottom:1px solid var(--rule-d);font-size:16.5px;color:var(--paper-a)}
.four b{display:block;font:800 22px/1.05 var(--sans);font-stretch:var(--cond);color:var(--label);margin-bottom:4px}
.fan{position:relative;height:clamp(300px,47vh,450px);max-width:520px;margin:0 auto;width:100%}
.fan img{position:absolute;top:5%;left:50%;width:50%;border-radius:8px;box-shadow:0 22px 40px rgba(0,0,0,.45);background:#fff}
.fan img:nth-child(1){transform:translateX(-112%) rotate(-9deg)}
.fan img:nth-child(2){transform:translateX(-50%) translateY(-6%);z-index:1}
.fan img:nth-child(3){transform:translateX(12%) rotate(9deg)}
.fan figcaption{position:absolute;inset:auto 0 0 0;text-align:center;font-size:13.5px;color:var(--mist)}

/* cover */
.cover{padding:0!important}
.cover>*{margin:0;width:100%}
.cover-photo{position:absolute;inset:0;z-index:0}
.cover-photo img{width:100%;height:100%;object-fit:cover;object-position:62% 46%}
.cover-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,24,17,.72),rgba(5,24,17,.1) 62%),linear-gradient(0deg,rgba(5,24,17,.5),rgba(5,24,17,0) 40%)}
.cover-in{position:relative;z-index:1;margin-top:auto!important;padding:clamp(20px,5vh,56px) var(--gr) clamp(20px,5vh,56px) var(--gl)}
.cover .slab{max-width:760px}
.cover h1{font-size:clamp(3.1rem,7.6vw,6.2rem);line-height:.9;color:var(--velvet)}
.cover .sub{font-size:clamp(17px,1.6vw,19.5px);color:var(--ink-2);max-width:48ch;margin-top:14px}
.cover .acts{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:20px}
.cover .stats strong{font-size:clamp(24px,3vw,38px)}
.cover .stats{grid-template-columns:repeat(4,minmax(0,1fr))}
.hint{font-size:14px;color:var(--soft)}

/* today */
.today .body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(20px,3.2vw,44px);align-items:center}
.today h2{font-size:clamp(2.2rem,4vw,3.8rem);color:var(--velvet);margin-top:8px}
.big{display:grid;grid-template-columns:1fr 1fr;border-top:3px solid var(--velvet);margin-top:20px}
.big div{padding:12px 12px 12px 0;border-bottom:1px solid var(--rule)}
.big div:nth-child(even){padding-left:16px;border-left:1px solid var(--rule)}
.big strong{display:block;font:800 clamp(26px,2.9vw,40px)/1 var(--sans);font-stretch:var(--wide);color:var(--velvet)}
.big span{font-size:14px;color:var(--soft)}
.shot{border-radius:6px;border:1px solid var(--rule);box-shadow:0 14px 30px rgba(8,42,31,.18)}

/* recommendation */
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;margin-top:28px;border-top:3px solid var(--foil)}
.three li{padding:18px 24px 6px 0}
.three li+li{padding-left:24px;border-left:1px solid var(--rule-d)}
.three b{display:block;font:800 clamp(24px,2.4vw,32px)/1 var(--sans);font-stretch:var(--cond);color:var(--label);margin-bottom:8px}
.three p{font-size:16.5px;color:var(--paper-a)}
.flow{display:flex;align-items:stretch;gap:10px;margin-top:30px;flex-wrap:wrap}
.flow .col{display:grid;gap:8px;flex:1 1 150px;min-width:0}
.flow .box{border:1px solid var(--rule-d);border-radius:3px;padding:10px 12px;font-size:14.5px;line-height:1.25;color:var(--paper-a);background:rgba(241,243,240,.05)}
.flow .box b{display:block;color:var(--label);font-stretch:var(--semi)}
.flow .box.key{border-color:var(--foil);background:rgba(225,181,60,.1)}
.flow .arrow{align-self:center;color:var(--foil);font-weight:800;font-size:20px}

/* the checklist: two nine-pocket pages */
.binder h2{font-size:clamp(2.2rem,4.2vw,3.6rem)}
.binder .lede{margin-top:10px}
.pages{display:grid;grid-template-columns:1fr 1fr;gap:clamp(14px,2.4vw,32px);margin-top:22px}
.page{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:10px;border-radius:6px;background:rgba(241,243,240,.07);border:1px solid var(--rule-d)}
.pocket{display:grid;align-content:space-between;gap:10px;text-align:left;min-height:clamp(88px,13.5vh,128px);padding:10px 11px;border-radius:4px;border:0;cursor:pointer;background:var(--label);color:var(--velvet);text-decoration:none;transition:transform .15s}
.pocket:hover{transform:translateY(-3px)}
.pocket i{font:900 28px/1 var(--sans);font-stretch:var(--cond);font-style:normal}
.pocket b{font:700 15px/1.15 var(--sans);font-stretch:var(--semi)}
.pocket small{font:600 10.5px/1.2 var(--sans);font-stretch:var(--wide);letter-spacing:.04em;text-transform:uppercase;color:var(--soft)}

/* insert: the six-minute trace */
.code{display:inline-block;font:800 clamp(22px,2.4vw,30px)/1 var(--sans);font-stretch:var(--wide);letter-spacing:.04em;color:var(--velvet);border:3px solid var(--velvet);border-radius:3px;padding:10px 14px;margin-top:18px}
.mins{border-top:3px solid var(--velvet)}
.mins li{display:grid;grid-template-columns:54px minmax(0,1fr);gap:14px;padding:10px 0;border-bottom:1px solid var(--rule);font-size:15.5px;color:var(--ink-2)}
.mins i{font:800 15px/1.4 var(--sans);font-stretch:var(--wide);font-style:normal;color:var(--brass);white-space:nowrap}
.mins b{color:var(--text)}

/* timeline, drawn to scale: 34 weeks */
.phases{display:flex;gap:6px;margin-top:6px}
.phase{min-width:0;display:grid;align-content:start;gap:8px}
.phase .bar-w{height:38px;background:var(--velvet);color:var(--label);border-radius:3px;display:flex;align-items:center;padding:0 10px;font:700 13px var(--sans);font-stretch:var(--wide);letter-spacing:.04em;white-space:nowrap;overflow:hidden}
.phase:nth-child(2) .bar-w{background:var(--foil);color:var(--velvet-d)}
.phase h3{font-size:23px;color:var(--velvet);line-height:1}
.phase p{font-size:14.5px;line-height:1.4;color:var(--ink-2)}
.phase p b{color:var(--text)}
.wk{display:flex;justify-content:space-between;font-size:12.5px;color:var(--soft);margin-top:14px;font-stretch:var(--wide)}

/* costs */
.cost3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:3px solid var(--velvet)}
.cost3>div{padding:14px 18px 0 0}
.cost3>div+div{padding-left:18px;border-left:1px solid var(--rule)}
.cost3 h3{font-size:22px;color:var(--velvet)}
.cost3 strong{display:block;font:800 clamp(26px,2.6vw,36px)/1 var(--sans);font-stretch:var(--wide);color:var(--velvet);margin:10px 0 4px}
.cost3 p,.cost3 li{font-size:15px;line-height:1.4;color:var(--ink-2)}
.cost3 ul{margin-top:8px;display:grid;gap:4px}
.cost3 li{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--rule);padding-top:4px}
.cost3 li span:last-child{font-weight:700;color:var(--text);white-space:nowrap}

/* needs list */
.ticks{border-top:3px solid var(--velvet);columns:2;column-gap:36px}
.ticks li{break-inside:avoid;display:grid;grid-template-columns:22px minmax(0,1fr);gap:12px;padding:11px 0;border-bottom:1px solid var(--rule);font-size:16px;color:var(--ink-2)}
.ticks li::before{content:"";width:18px;height:18px;border:2px solid var(--velvet);border-radius:2px;margin-top:3px}
.ticks b{color:var(--text)}
.wide-head h2{font-size:clamp(2.1rem,3.8vw,3.5rem);color:var(--velvet);margin-top:8px}
.wide-head p{font-size:17.5px;color:var(--ink-2);max-width:62ch;margin:12px 0 18px}

/* close */
.close-acts{display:flex;gap:14px;flex-wrap:wrap;margin-top:26px}
.fine{font-size:14px;color:var(--mist);margin-top:22px;max-width:60ch}
.trio{border-radius:6px;box-shadow:0 24px 50px rgba(0,0,0,.4)}

/* control bar */
.bar{position:fixed;inset:auto 0 0 0;z-index:5;height:calc(var(--bar) + env(safe-area-inset-bottom,0px));
  padding:0 var(--gr) env(safe-area-inset-bottom,0px) var(--gl);display:flex;align-items:center;gap:14px;
  background:#051811;border-top:1px solid var(--rule-d)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--label);flex-shrink:0}
.brand .mark{width:24px;height:32px;border:2px solid var(--label);border-radius:3px;display:grid;grid-template-rows:9px 1fr;overflow:hidden}
.brand .mark::before{content:"";background:var(--label)}
.brand .mark span{display:grid;place-items:center;font:800 9px/1 var(--sans);font-stretch:var(--cond)}
.brand b{font:800 18px/1 var(--sans);font-stretch:var(--cond)}
.prog{flex:1;display:flex;gap:3px;align-items:center;min-width:0;height:44px}
.prog button{flex:1;min-width:0;height:44px;padding:0;border:0;background:none;cursor:pointer;display:flex;align-items:center}
.prog button::before{content:"";display:block;width:100%;height:4px;border-radius:2px;background:rgba(241,243,240,.2);transition:background .2s,height .2s}
.prog button.seen::before{background:var(--mist)}
.prog button.cur::before{background:var(--foil);height:8px}
.count{font:700 14px var(--sans);font-stretch:var(--wide);color:var(--mist);white-space:nowrap}
.nav{display:flex;gap:8px;flex-shrink:0}
.nav button{min-width:46px;height:44px;padding:0 14px;border-radius:3px;border:2px solid rgba(241,243,240,.4);background:none;font:700 15px var(--sans);font-stretch:var(--semi);cursor:pointer;color:var(--label)}
.nav button:hover{border-color:var(--label)}
.nav button[disabled]{opacity:.35;pointer-events:none}
.nav .next{background:var(--foil);border-color:var(--foil);color:var(--velvet-d)}
.nav .next:hover{background:var(--foil-h);border-color:var(--foil-h)}

/* shorter laptop screens */
@media (min-width:861px) and (max-height:800px){
  body{font-size:16px}
  .q-head h2{font-size:clamp(1.9rem,3vw,2.7rem)}
  .rows>div{padding:9px 0}.rows dd{font-size:15px}
  .short{font-size:17px;margin-top:12px}.stats{margin-top:14px}
  .grade b{width:60px;height:60px;font-size:36px}
  .dark h2{font-size:clamp(2.3rem,4.6vw,3.9rem)}
  .mins li{padding:7px 0;font-size:14.5px}
  .today h2{font-size:clamp(2rem,3.2vw,2.9rem)}
  .big strong{font-size:clamp(24px,2.5vw,32px)}
}

/* phones and narrow tablets: one column, the label first */
@media (max-width:860px){
  :root{--bar:60px}
  body{font-size:16px}
  .slide>*{margin-top:0}
  .slide.cover>.cover-in{margin-top:auto!important}
  .topic .body,.today .body,.split,.topic.wide .body>div:first-child{grid-template-columns:minmax(0,1fr)}
  .topic.wide .short{margin-top:0}
  .band{padding:9px 16px;font-size:11px}
  .band span:last-child{white-space:normal}
  .band .num{white-space:nowrap}
  .prog{pointer-events:none}
  .grade{display:none}
  .q-head{grid-template-columns:minmax(0,1fr)}
  .rows>div{grid-template-columns:minmax(0,1fr);padding:12px 0}
  .stats strong{font-size:20px}
  .stats span{font-size:12.5px}
  .stats div{padding-right:8px}.stats div+div{padding-left:10px}
  .cover .stats{grid-template-columns:1fr 1fr}
  .cover .stats div:nth-child(3){padding-left:0;border-left:0}
  .cover .stats div:nth-child(n+3){border-top:1px solid var(--rule);margin-top:10px}
  .four{grid-template-columns:minmax(0,1fr)}
  .fan{height:min(66vw,310px);order:-1}
  .fan img{width:43%;top:6%}
  .three{grid-template-columns:minmax(0,1fr)}
  .three li{padding:14px 0}
  .three li+li{padding-left:0;border-left:0;border-top:1px solid var(--rule-d)}
  .flow{display:grid;grid-template-columns:minmax(0,1fr)}
  .flow .arrow{justify-self:center;transform:rotate(90deg)}
  .pages{grid-template-columns:minmax(0,1fr)}
  .pocket{min-height:92px;padding:9px}
  .pocket b{font-size:13.5px}
  .pocket small{display:none}

  S.push('<section class="slide dark binder" id="checklist" aria-label="The checklist"><div><p class="eyebrow">The checklist</p><h2>Your list, all 18.</h2>'+
   '<p class="lede">Two binder pages, nine pockets each. Pick any topic, or press Next to go through them in your order.</p>'+
   '<div class="pages"><div class="page">'+p1+'</div><div class="page">'+p2+'</div></div></div></section>');
})();
/* 6-17: topics 1-12 */
T.slice(0,12).forEach(function(t,i){S.push(topic(t,i));});
/* 18. insert: traceability */
S.push('<section class="slide topic" aria-label="Insert: traceability"><div class="slab"><div class="band foil"><span>Insert card</span><span>Not on your list. It runs through all 18.</span></div>'+
 '<div class="body"><div><p class="eyebrow">Traceability</p><div class="q-head"><h2>When something breaks, a short code leads straight to the cause.</h2></div>'+
 '<p class="short">Any error a collector or staff member sees shows a reference code. They read it to me, and I can see the whole story behind it.</p>'+
 '<span class="code num">MCC-4KQ7-T2</span>'+
 '<p class="short">Example: a collector is charged twice for a Silver vault plan. Six minutes later I know the cause, the release that introduced it, and every other customer it touched.</p>'+
 '</div><div><ol class="mins">'+
 '<li><i>Min 0</i><span><b>Look up the code.</b> It opens the account, the exact request, the time and the version of the code.</span></li>'+
 '<li><i>Min 1</i><span><b>Follow the request.</b> Stripe charged the card, then our save timed out. The collector saw an error.</span></li>'+
 '<li><i>Min 3</i><span><b>Read the logs.</b> A second click 38 seconds later created a second subscription. That is the bug.</span></li>'+
 '<li><i>Min 4</i><span><b>Check Stripe\'s messages.</b> Two charges, confirmed from the raw records.</span></li>'+
 '<li><i>Min 5</i><span><b>Check the cards.</b> All 140 cards checked in that afternoon are recorded correctly.</span></li>'+
 '<li><i>Min 6</i><span><b>Find everyone affected.</b> The release touched 3 accounts. One more duplicate found.</span></li>'+
 '</ol><p class="need"><b>Then:</b> refund and email each customer, fix the code, add a test so it cannot return, and send you an incident note.</p>'+
 '<a class="more textlink" href="'+REPO+'#traceability-finding-any-bug-fast" target="_blank" rel="noopener">Read the full answer in the proposal</a></div></div></div></section>');
/* 19-24: topics 13-18 */
T.slice(12).forEach(function(t,i){S.push(topic(t,i+12));});
/* 25. no shortcuts */
S.push('<section class="slide" aria-label="Where there is no shortcut"><div class="slab"><div class="band"><span>Straight answers</span><span>What I found when I checked</span></div><div class="body wide-head">'+
 '<p class="eyebrow">Four places with no shortcut today</p><h2>Where a partner does not offer what we would want.</h2>'+
 '<p>I checked each of these on 8 November 2026. The plan works around every one, and nothing depends on a promise a partner has not made.</p>'+
 '<dl class="rows"><div><dt>Card Ladder</dt><dd>No public API or licensing program. Values come in by staff entry or file import, and a licensed feed can plug in later.</dd></div>'+
 '<div><dt>Fanatics Collect</dt><dd>No public seller API. Staff record batches and import report files.</dd></div>'+
 '<div><dt>PSA submissions</dt><dd>PSA\'s API checks certs but cannot create submissions or read order status. Only authorized dealers may submit for others.</dd></div>'+
 '<div><dt>Shipping insurance</dt><dd>EasyPost\'s cover excludes cosmetic damage to collectibles and items for resale, and stops at $5,000 a box. The real protection is a transit policy from your broker.</dd></div></dl>'+
 '</div></div></section>');
/* 26. next steps */
S.push('<section class="slide" aria-label="What I need from you to start"><div class="slab"><div class="band"><span>Before kickoff</span><span>Your side of the table</span></div><div class="body wide-head">'+
 '<p class="eyebrow">What I need from you to start</p><h2>Seven things, then I build.</h2>'+
 '<p>After that it is about an hour a week from you for the demo, and a sign-off at the end of each phase.</p>'+
 '<ul class="ticks"><li><span><b>Terms.</b> The rate, payment on acceptance of each phase, and a support plan.</span></li>'+
 '<li><span><b>A My CC email address</b> that owns every account.</span></li>'+
 '<li><span><b>One setup session together,</b> where you create the accounts and hold the top admin role.</span></li>'+
 '<li><span><b>Two hardware security keys</b> for the owner login. One is the backup.</span></li>'+
 '<li><span><b>A D-U-N-S number request.</b> It is free, and both app stores need it.</span></li>'+
 '<li><span><b>A password manager</b> for the business.</span></li>'+
 '<li><span><b>A named contact</b> for approvals and alerts, with a phone number for emergencies.</span></li></ul>'+
 '<a class="more textlink" href="'+REPO+'#decisions-and-accounts-i-need-from-you" target="_blank" rel="noopener">See the full list, phase by phase</a>'+
 '</div></div></section>');
/* 27. close */
S.push('<section class="slide dark" aria-label="Thank you"><div class="split"><div>'+
 '<p class="eyebrow">Collect, preserve, enjoy</p><h2>Thank you for the vision. I would like to build it.</h2>'+
 '<p class="lede">Everything in this deck comes from the full written proposal, with every price and source linked.</p>'+
 '<div class="close-acts"><a class="btn btn-foil" href="'+REPO+'" target="_blank" rel="noopener">Read the full proposal</a>'+
 '<a class="btn btn-ghost" href="'+SITE+'" target="_blank" rel="noopener">The website</a>'+
 '<a class="btn btn-ghost" href="'+PORTAL+'" target="_blank" rel="noopener">The portal demo</a></div>'+
 '<p class="fine">Every price and fact was checked on 8 November 2026. Providers change their prices often, so I check each one again on the day I start building against it.</p>'+
 '</div><img class="trio" src="../img/trio.webp" alt="Three cards in display slabs in the velvet case" loading="lazy"></div></section>');

var deck=document.getElementById("deck"), prog=document.getElementById("prog"), count=document.getElementById("count");
deck.innerHTML=S.join("");
var slides=[].slice.call(deck.querySelectorAll(".slide")), N=slides.length, cur=-1, CHECK=4;
prog.innerHTML=slides.map(function(s,i){return '<button type="button" data-i="'+i+'" aria-label="Slide '+(i+1)+': '+s.getAttribute("aria-label")+'"></button>';}).join("");
var ticks=[].slice.call(prog.children);

function go(i,quiet){
  i=Math.max(0,Math.min(N-1,i)); if(i===cur) return;
  deck.classList.toggle("back",i<cur);
  slides.forEach(function(s,k){s.classList.toggle("on",k===i);s.classList.toggle("gone",k===cur&&k!==i);s.setAttribute("aria-hidden",k===i?"false":"true");if("inert" in s) s.inert=k!==i;});
  ticks.forEach(function(t,k){t.classList.toggle("cur",k===i);if(k<=i) t.classList.add("seen");t.setAttribute("aria-current",k===i?"true":"false");});
  slides[i].scrollTop=0; cur=i;
  count.textContent=pad(i+1)+" / "+N;
  document.getElementById("prev").disabled=i===0;
  document.getElementById("next").disabled=i===N-1;
  if(!quiet){try{history.replaceState(null,"","#"+(i+1));}catch(e){}}
}
function fromHash(){var h=location.hash.slice(1),n=h==="checklist"?CHECK+1:parseInt(h,10);go(n>=1&&n<=N?n-1:0,true);}

document.getElementById("next").addEventListener("click",function(){go(cur+1);});
document.getElementById("prev").addEventListener("click",function(){go(cur-1);});
document.getElementById("list").addEventListener("click",function(){go(CHECK);});
prog.addEventListener("click",function(e){var b=e.target.closest("button");if(b) go(+b.dataset.i);});
deck.addEventListener("click",function(e){
  if(e.target.closest("[data-go=next]")){go(cur+1);return;}
  var p=e.target.closest(".pocket");if(p){e.preventDefault();go(parseInt(p.getAttribute("href").slice(1),10)-1);}
});
document.querySelector(".brand").addEventListener("click",function(e){e.preventDefault();go(0);});
window.addEventListener("hashchange",fromHash);
document.addEventListener("keydown",function(e){
  if(e.altKey||e.ctrlKey||e.metaKey) return;
  var k=e.key;
  if(k==="ArrowRight"||k==="PageDown"){e.preventDefault();go(cur+1);}
  else if(k==="ArrowLeft"||k==="PageUp"){e.preventDefault();go(cur-1);}
  else if(k===" "&&!e.target.closest("button,a")){e.preventDefault();go(cur+(e.shiftKey?-1:1));}
  else if(k==="Home"){e.preventDefault();go(0);}
  else if(k==="End"){e.preventDefault();go(N-1);}
  else if(k==="Escape"||k==="l"||k==="L"){go(CHECK);}
});
/* swipe: only a clearly sideways drag turns the page, so reading up and down is never hijacked */
var tx=0,ty=0,tt=0;
deck.addEventListener("touchstart",function(e){var t=e.changedTouches[0];tx=t.clientX;ty=t.clientY;tt=Date.now();},{passive:true});
deck.addEventListener("touchend",function(e){
  var t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;
  if(e.target.closest(".scroll-x")) return;
  if(Math.abs(dx)>56&&Math.abs(dx)>Math.abs(dy)*1.8&&Date.now()-tt<700) go(cur+(dx<0?1:-1));
},{passive:true});
fromHash();
})();
</script>
